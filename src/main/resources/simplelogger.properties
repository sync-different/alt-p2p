# slf4j-simple configuration (bundled into the fat JAR).
#
# Quiet the per-file transfer logs (Offered/Verified/skipping...) so the live
# progress bar stays on a single line instead of being interrupted by log lines.
# Connection and coordination-server logs stay at INFO.
#
# To see the per-file detail again:
#   java -Dorg.slf4j.simpleLogger.log.com.alterante.p2p.transfer=info -jar ...
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.com.alterante.p2p.transfer=warn
